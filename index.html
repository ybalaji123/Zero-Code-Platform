<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Code ERP Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active">
  <div class="auth-bg">
    <div class="auth-card">
      <div class="brand-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M14 24h20M24 14l10 10-10 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="auth-title">Zero-Code ERP</h1>
      <p class="auth-sub">Enterprise platform for modern businesses</p>

      <div class="tab-switch">
        <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
        <button class="tab-btn" onclick="showTab('register')">Register</button>
      </div>

      <div id="login-tab">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="you@company.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="••••••••">
        </div>
        <div id="login-err" class="err-msg"></div>
        <button class="btn-primary full" onclick="doLogin()">Sign In</button>
      </div>

      <div id="register-tab" style="display:none">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-user" placeholder="yourname">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" placeholder="you@company.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-pass" placeholder="••••••••">
        </div>
        <div id="reg-err" class="err-msg"></div>
        <button class="btn-primary full" onclick="doRegister()">Create Account</button>
      </div>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-screen" class="screen">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="10" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M14 24h20M24 14l10 10-10 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="brand-name">Zero-Code ERP</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">OVERVIEW</div>
      <a class="nav-item active" onclick="showPage('dashboard')"><span class="nav-icon">⊞</span>Dashboard</a>

      <div class="nav-section">OPERATIONS</div>
      <a class="nav-item" onclick="showPage('billing')"><span class="nav-icon">🧾</span>Billing</a>
      <a class="nav-item" onclick="showPage('workers')"><span class="nav-icon">👷</span>Workers</a>
      <a class="nav-item" onclick="showPage('attendance')"><span class="nav-icon">📅</span>Attendance</a>
      <a class="nav-item" onclick="showPage('rental')"><span class="nav-icon">🏠</span>Rental</a>
      <a class="nav-item" onclick="showPage('restaurant')"><span class="nav-icon">🍴</span>Restaurant</a>

      <div class="nav-section">FINANCE</div>
      <a class="nav-item" onclick="showPage('invoices')"><span class="nav-icon">📄</span>Invoices</a>
      <a class="nav-item" onclick="showPage('expenses')"><span class="nav-icon">💸</span>Expenses</a>

      <div class="nav-section">GROWTH</div>
      <a class="nav-item" onclick="showPage('marketing')"><span class="nav-icon">📢</span>Marketing</a>
      <a class="nav-item" onclick="showPage('hr')"><span class="nav-icon">👥</span>Human Resources</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="avatar" id="user-avatar">U</div>
        <span id="user-label">User</span>
      </div>
      <button class="btn-ghost" onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-right">
        <span id="topbar-user" class="user-badge"></span>
      </div>
    </div>
    <div id="page-content"></div>
  </main>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
